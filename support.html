<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WonderRoll Support</title>
  <meta name="description" content="Support page for WonderRoll.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #11100d;
      --panel: #1c1914;
      --text: #f4ead7;
      --muted: #b9ad98;
      --accent: #e2a84b;
      --line: #3b3328;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    main {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: 0;
    }
    p { color: var(--muted); }
    a { color: var(--accent); }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <main>
    <h1>WonderRoll Support</h1>
    <p>Need help with WonderRoll, purchases, permissions, or your film workflow?</p>
    <div class="card">
      <p>Email: <a href="mailto:stonsy1999@gmail.com">stonsy1999@gmail.com</a></p>
      <p>Privacy Policy: <a href="https://lei-xiong1999.github.io/wonderroll-privacy/">WonderRoll Privacy Policy</a></p>
    </div>
  </main>
</body>
</html>
